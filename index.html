<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <script>
      (function() {
        const origError = console.error;
        console.error = function(...args) {
          const msg = args.map(a => (a && (a.message || a.stack)) || String(a)).join(' ');
          if (msg.includes('WebSocket') || msg.includes('@vite/client') || msg.includes('ws:')) {
            return;
          }
          origError.apply(console, args);
        };
        window.addEventListener('error', function(e) {
          const errStr = (e.message || (e.error && (e.error.message || e.error.stack))) || '';
          if (errStr.includes('WebSocket') || errStr.includes('@vite/client')) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          const reasonStr = (e.reason && (e.reason.message || e.reason.stack || String(e.reason))) || '';
          if (reasonStr.includes('WebSocket') || reasonStr.includes('@vite/client')) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
    <title>Nova Shop | প্রিমিয়াম অনলাইন শপ ও রিসেলার প্ল্যাটফর্ম</title>
    <meta name="description" content="Nova Shop - বাংলাদেশের বিশ্বস্ত ও আধুনিক অনলাইন কেনাকাটা এবং রিসেলার প্ল্যাটফর্ম। ক্যাশ অন ডেলিভারি, বিকাশ ও নগদ পেমেন্ট সুবিধা।" />
