<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="50%" stop-color="#be123c" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>

    <!-- Metallic Gold Border Gradient -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Letter 'S' Metallic Gradient -->
    <linearGradient id="letterSGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#fff1f2" />
      <stop offset="100%" stop-color="#fecdd3" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- 3D Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#4c0519" flood-opacity="0.45" />
    </filter>

    <filter id="letterShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4c0519" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Outer Shadow Container -->
  <g filter="url(#shadow)">
    <!-- Main Squircle Shape with Gold Rim -->
    <rect x="24" y="24" width="464" height="464" rx="128" fill="url(#bgGrad)" stroke="url(#goldRim)" stroke-width="12" />

    <!-- Glossy Reflection Highlight -->
    <path d="M 40 148 C 40 84 84 40 148 40 L 364 40 C 428 40 472 84 472 148 C 472 200 360 170 256 170 C 152 170 40 200 40 148 Z" fill="#ffffff" fill-opacity="0.12" />
  </g>

  <!-- Stylized Luxury Letter 'S' Motif -->
  <g filter="url(#letterShadow)">
    <!-- Base Elegant Letter 'S' Silhouette -->
    <path d="M 356 176 
             C 334 140 298 124 252 124 
             C 190 124 146 162 146 216 
             C 146 276 198 298 250 314 
             C 310 332 352 352 352 400 
             C 352 458 300 496 234 496 
             C 172 496 124 458 108 412 
             L 164 388 
             C 174 416 202 444 240 444 
             C 278 444 300 422 300 392 
             C 300 348 254 330 208 314 
             C 152 294 102 268 102 210 
             C 102 154 154 116 224 116 
             C 278 116 322 138 348 174 
             Z"
          fill="url(#letterSGrad)" />

    <!-- Gold Accent Curve on Lower Spine of 'S' -->
    <path d="M 230 318 C 280 334 322 354 322 396 C 322 414 312 430 294 440" 
          stroke="url(#goldAccent)" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.85" />
    
    <!-- Gold Accent on Upper Curve of 'S' -->
    <path d="M 264 126 C 214 126 176 154 176 196" 
          stroke="url(#goldAccent)" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.85" />

    <!-- Luxury 4-Point Sparkle / Star at Upper Right of 'S' -->
    <path d="M 374 136 Q 374 162 396 162 Q 374 162 374 188 Q 374 162 352 162 Q 374 162 374 136 Z" 
          fill="url(#goldRim)" />
    <!-- Secondary Mini Sparkle -->
    <circle cx="414" cy="180" r="6" fill="#fef08a" />
    <circle cx="120" cy="330" r="5" fill="#fef08a" opacity="0.8" />
  </g>
</svg>